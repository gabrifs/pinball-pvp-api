name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ────────────────────────────────────────────────────────────────────
  # Runs on a GitHub-hosted runner and deploys to the Windows PC via Docker's SSH
  # context backend — the runner drives the remote Docker daemon over an SSH tunnel.
  # Prerequisites on the host:
  #   1. Enable Windows OpenSSH Server (Settings → Optional Features → OpenSSH Server).
  #   2. Generate an Ed25519 key pair and add the public key to
  #      C:\Users\<user>\.ssh\authorized_keys on the host.
  #   3. Set DEPLOY_SSH_KEY (secret), DEPLOY_HOST, DEPLOY_SSH_PORT, DEPLOY_SSH_USER
  #      in Settings → Secrets and variables → Actions.
  #   4. Set all app secrets listed in the step env blocks below.
  #   5. Docker Desktop must be running on the host; docker must be in PATH for the
  #      SSH user (Docker Desktop ensures this).
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          sha="${{ github.sha }}"
          echo "value=sha-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ vars.DEPLOY_SSH_PORT }}" "${{ vars.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Create Docker context
        shell: bash
        run: |
          docker context create production \
            --docker "host=ssh://${{ vars.DEPLOY_SSH_USER }}@${{ vars.DEPLOY_HOST }}:${{ vars.DEPLOY_SSH_PORT }}" \
            --description "Production host"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull new images
        shell: bash
        run: docker --context production compose pull api migrate
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
          Jwt__ExpirationMinutes: ${{ secrets.JWT_EXPIRATION_MINUTES }}
          Jwt__RefreshTokenExpirationDays: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_DAYS }}
          Email__Host: ${{ secrets.EMAIL_HOST }}
          Email__Port: ${{ secrets.EMAIL_PORT }}
          Email__FromAddress: ${{ secrets.EMAIL_FROM_ADDRESS }}
          Email__FromName: ${{ secrets.EMAIL_FROM_NAME }}
          Email__Username: ${{ secrets.EMAIL_USERNAME }}
          Email__Password: ${{ secrets.EMAIL_PASSWORD }}
          Cors__AllowedOrigins__0: ${{ secrets.CORS_ALLOWED_ORIGIN_0 }}
          Leaderboard__WinRateMinMatches: ${{ vars.LEADERBOARD_WIN_RATE_MIN_MATCHES }}
          Maintenance__PurgeIntervalHours: ${{ vars.MAINTENANCE_PURGE_INTERVAL_HOURS }}
          PasswordRecovery__ExpirationMinutes: ${{ vars.PASSWORD_RECOVERY_EXPIRATION_MINUTES }}

      - name: Deploy (migrate + start services)
        shell: bash
        run: docker --context production compose up -d --wait
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTION_STRING }}
          Jwt__Key: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
          Jwt__ExpirationMinutes: ${{ secrets.JWT_EXPIRATION_MINUTES }}
          Jwt__RefreshTokenExpirationDays: ${{ secrets.JWT_REFRESH_TOKEN_EXPIRATION_DAYS }}
          Email__Host: ${{ secrets.EMAIL_HOST }}
          Email__Port: ${{ secrets.EMAIL_PORT }}
          Email__FromAddress: ${{ secrets.EMAIL_FROM_ADDRESS }}
          Email__FromName: ${{ secrets.EMAIL_FROM_NAME }}
          Email__Username: ${{ secrets.EMAIL_USERNAME }}
          Email__Password: ${{ secrets.EMAIL_PASSWORD }}
          Cors__AllowedOrigins__0: ${{ secrets.CORS_ALLOWED_ORIGIN_0 }}
          Leaderboard__WinRateMinMatches: ${{ vars.LEADERBOARD_WIN_RATE_MIN_MATCHES }}
          Maintenance__PurgeIntervalHours: ${{ vars.MAINTENANCE_PURGE_INTERVAL_HOURS }}
          PasswordRecovery__ExpirationMinutes: ${{ vars.PASSWORD_RECOVERY_EXPIRATION_MINUTES }}
