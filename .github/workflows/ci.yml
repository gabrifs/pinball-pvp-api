name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy ────────────────────────────────────────────────────────────────────
  # Runs on the self-hosted GitHub Actions runner on the Windows PC (Docker Desktop).
  # Prerequisites on the host:
  #   1. Register a self-hosted runner for this repo (Settings → Actions → Runners).
  #   2. Copy .env.example to the path stored in the DEPLOY_ENV_FILE repository
  #      variable (Settings → Variables), e.g. C:\pinball-secrets\pinball.env,
  #      and fill in all real values.
  # The runner pulls the newly-built image, runs migrations, then rolls out the API.
  deploy:
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        shell: bash
        run: |
          sha="${{ github.sha }}"
          echo "value=sha-${sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull new images
        shell: bash
        run: docker compose --env-file "$DEPLOY_ENV_FILE" pull api migrate
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}

      - name: Deploy (migrate + start services)
        shell: bash
        run: docker compose --env-file "$DEPLOY_ENV_FILE" up -d --wait
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.value }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEPLOY_ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
